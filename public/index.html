<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>The Creative Load</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap">
<style>
  :root{
    --bg:#fdf5ec; --ink:#161313; --muted:#7a6f66; --card:#fff; --line:#eadfd2;
    --yellow:#ffd23f; --pink:#ff86b5; --blue:#4aa8ff; --green:#3ed07a; --purple:#c7a6f5; --orange:#ff7a1a; --red:#ff3b47;
    --crit:#ff86b5; --high:#ffd23f; --med:#4aa8ff;
    --f:"Poppins","Arial Rounded MT Bold","Arial Black",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:600 15px/1.35 var(--f)}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 22px 80px}
  button{font:800 13px/1 var(--f);cursor:pointer;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:11px 18px;transition:transform .08s}
  button:hover{transform:translateY(-2px)}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--yellow)}
  button.icon{padding:7px 12px;font-size:12px}
  button.icon.go{background:var(--green)}
  button:disabled{opacity:.3;cursor:default;transform:none}
  .danger{background:var(--pink)}

  /* header */
  .top{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
  h1{margin:0;font:900 46px/.92 var(--f);letter-spacing:-1.5px;text-transform:uppercase;position:relative;padding-right:46px}
  h1::after{content:"";position:absolute;right:6px;bottom:6px;width:30px;height:26px;
    background:
      linear-gradient(#161313,#161313) 0 20px/16px 4px no-repeat,
      linear-gradient(#161313,#161313) 12px 6px/4px 14px no-repeat;opacity:0}
  .cap{display:flex;align-items:center;gap:22px;background:var(--yellow);border-radius:34px;padding:16px 22px 16px 30px;border-left:2px solid var(--ink);position:relative}
  .cap .l{font:800 20px/1 var(--f);text-transform:uppercase;letter-spacing:-.3px}
  .cap .pct{font:900 82px/.85 var(--f);letter-spacing:-4px}
  .cap .msg{margin-left:auto;background:var(--pink);border-radius:26px;padding:16px 24px;font:800 22px/1.05 var(--f);text-transform:uppercase;text-align:center;max-width:300px}
  .sub{font:600 14px/1 var(--f);color:var(--muted);margin:14px 0 0}
  .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end;margin:18px 0 0}
  .savestate{font:600 12px var(--f);color:var(--muted);margin-right:auto}

  /* stage */
  .stage{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding:26px 4px 6px;margin-top:6px}
  .col{flex:1 0 190px;display:flex;flex-direction:column;align-items:center;min-width:190px}
  .stackbox{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:100%;position:relative;z-index:3;margin-bottom:-50px}
  .stackbox.has::before,.stackbox.has::after{content:"";position:absolute;bottom:-14px;width:30px;height:30px;border-radius:50%;background:var(--c);z-index:4;box-shadow:inset -4px -4px 0 rgba(0,0,0,.12)}
  .stackbox.has::before{left:calc(50% - var(--hw,84px))} .stackbox.has::after{right:calc(50% - var(--hw,84px))}
  .blk{position:relative;padding:9px 14px;display:flex;align-items:center;justify-content:center;gap:6px;
       border-radius:10px;font:800 14px/1 var(--f);text-transform:uppercase;letter-spacing:-.2px;color:var(--ink);
       box-shadow:inset 7px 0 0 rgba(0,0,0,.13),0 5px 0 rgba(0,0,0,.14);margin-top:-2px;white-space:normal;text-align:center;line-height:1.08;}
  .blk.sup{margin-right:6px}
  .blk.sup{animation:fireglow 1.1s ease-in-out infinite alternate}
  @keyframes fireglow{from{box-shadow:inset 7px 0 0 rgba(0,0,0,.13),0 5px 0 rgba(0,0,0,.14),0 0 12px 3px rgba(255,110,0,.6)}to{box-shadow:inset 7px 0 0 rgba(0,0,0,.13),0 5px 0 rgba(0,0,0,.14),0 0 24px 8px rgba(255,150,0,.85)}}
  .blk .fire{position:absolute;left:4px;right:4px;top:0;height:0;pointer-events:none;z-index:3}
  .blk .fire i{position:absolute;bottom:-3px;width:15px;height:calc(var(--h)*1px);margin-left:-7px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:radial-gradient(ellipse at 50% 85%,#fff3a0 0,#ffc21a 35%,#ff6a00 70%,#e0181d 100%);transform-origin:50% 100%;animation:flick .45s ease-in-out infinite alternate}
  @keyframes flick{0%{transform:scale(.8,.75) skewX(-8deg)}50%{transform:scale(1.05,1.1) skewX(6deg)}100%{transform:scale(.9,.9) skewX(-4deg)}}
  .blk.critical{background:var(--pink)} .blk.high{background:var(--yellow)} .blk.medium{background:var(--blue)}
  .blk .rk{font:900 11px/1 var(--f);background:var(--ink);color:#fff;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px;flex:none}
  .blk .dd{display:block;margin-top:3px;font:500 .56em/1.1 var(--f);letter-spacing:0;opacity:.75;text-transform:none}
  .blk .dd.wd{font-weight:700;opacity:.85;margin-top:2px}
  .blk .dd.red{color:#c4001d;font-weight:800;opacity:1}
  .blk .dd.hot{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:999px;color:#fff;background:#ff7a00;font:900 .66em/1.2 var(--f);letter-spacing:.2px;opacity:1;text-transform:uppercase;animation:dueblink 1s ease-in-out infinite alternate}
  @keyframes dueblink{0%{background:#ff8a00}100%{background:#e5112b}}
  .blk .sh{font:900 10px/1 var(--f);background:#fff;border-radius:999px;padding:3px 6px;flex:none}
  .blob{display:block;position:relative;z-index:2;overflow:visible}
  .shadow{width:150px;height:14px;border-radius:50%;background:rgba(0,0,0,.09);margin-top:-8px}
  .nm{font:900 26px/1 var(--f);text-transform:uppercase;letter-spacing:-.6px;margin-top:14px}
  .bar{display:flex;align-items:center;gap:10px;margin-top:10px;width:86%}
  .bar .tr{flex:1;height:18px;border-radius:99px;background:#efe6da;overflow:hidden}
  .bar .fl{height:100%;border-radius:99px}
  .bar b{font:800 15px/1 var(--f);min-width:44px}
  .mood{font:700 12px/1 var(--f);color:var(--muted);margin-top:8px;text-transform:uppercase;letter-spacing:.4px;text-align:center}
  .legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:18px 0 0;font:700 12px var(--f);color:var(--muted)}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-3px;box-shadow:inset 4px 0 0 rgba(0,0,0,.13)}


  /* moods */
  .stackbox,.blob{transform-origin:50% 100%;animation-delay:var(--d,0s)}
  .col{--d:0s}
  .col.bored .blob{animation:slouch 3.4s ease-in-out infinite}
  .col.bored .look{animation:look 4s ease-in-out infinite}
  .col.bored .zz{animation:zz 3s ease-in-out infinite}
  .col.bored .zz.z2{animation-delay:1.1s}
  .col.light .stackbox{animation:lift 1.3s ease-in-out infinite}
  .col.light .blob{animation:squat 1.3s ease-in-out infinite}
  .col.medium .stackbox{animation:tip 8s ease-in-out infinite;animation-delay:calc(var(--d,0s)*5)}
  .col.medium .blob{animation:lean 8s ease-in-out infinite;animation-delay:calc(var(--d,0s)*5)}
  .col.medium .track{animation:track 8s ease-in-out infinite;animation-delay:calc(var(--d,0s)*5)}
  .col.medium .l1{animation:step1 8s ease-in-out infinite;animation-delay:calc(var(--d,0s)*5);transform-box:fill-box;transform-origin:50% 0}
  .col.medium .l2{animation:step2 8s ease-in-out infinite;animation-delay:calc(var(--d,0s)*5);transform-box:fill-box;transform-origin:50% 0}
  .col.heavy .stackbox{animation:hbox 4.4s ease-in-out infinite;animation-delay:calc(var(--d,0s)*6)}
  .col.heavy .blob{animation:hbody 4.4s ease-in-out infinite;animation-delay:calc(var(--d,0s)*6 - .5s)}
  .col.heavy .l1{animation:hstep1 4.4s ease-in-out infinite;animation-delay:calc(var(--d,0s)*6 - .5s);transform-box:fill-box;transform-origin:50% 0}
  .col.heavy .l2{animation:hstep2 4.4s ease-in-out infinite;animation-delay:calc(var(--d,0s)*6 - .5s);transform-box:fill-box;transform-origin:50% 0}
  .sw{animation:drip 2.4s ease-in infinite} .sw.d2{animation-delay:-.8s} .sw.d3{animation-delay:-1.6s}
  @keyframes slouch{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.95) translateY(2px)}}
  @keyframes look{0%,35%{transform:translateX(-4px)}50%,85%{transform:translateX(4px)}100%{transform:translateX(-4px)}}
  @keyframes zz{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
  @keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
  @keyframes squat{0%,100%{transform:scaleY(.95)}50%{transform:scaleY(1.03)}}
  @keyframes tip{0%,32%,50%,82%,100%{transform:rotate(0)}20%{transform:translateX(8px) rotate(9deg)}22%{transform:translateX(9px) rotate(9.6deg)}24%{transform:translateX(8px) rotate(8.7deg)}26%{transform:translateX(9px) rotate(9.4deg)}28%{transform:translateX(-3px) rotate(-4deg)}70%{transform:translateX(-8px) rotate(-9deg)}72%{transform:translateX(-9px) rotate(-9.6deg)}74%{transform:translateX(-8px) rotate(-8.7deg)}76%{transform:translateX(-9px) rotate(-9.4deg)}78%{transform:translateX(3px) rotate(4deg)}}
  @keyframes lean{0%,34%,50%,84%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-5px) rotate(-2deg)}28%{transform:translateX(7px) rotate(2deg)}70%{transform:translateX(5px) rotate(2deg)}78%{transform:translateX(-7px) rotate(-2deg)}}
  @keyframes track{0%,34%,50%,84%,100%{transform:translateX(0)}20%{transform:translateX(6px)}28%{transform:translateX(-4px)}70%{transform:translateX(-6px)}78%{transform:translateX(4px)}}
  @keyframes step1{0%,70%,88%,100%{transform:rotate(0)}78%{transform:rotate(-18deg)}}
  @keyframes step2{0%,20%,38%,100%{transform:rotate(0)}28%{transform:rotate(18deg)}}
  @keyframes hbox{0%,100%{transform:translateX(-14px) rotate(-7deg)}50%{transform:translateX(14px) rotate(7deg)}}
  @keyframes hbody{0%,100%{transform:translateX(-18px) rotate(-2.5deg)}50%{transform:translateX(18px) rotate(2.5deg)}}
  @keyframes hstep1{0%,40%,60%,100%{transform:rotate(0)}15%{transform:rotate(-16deg)}}
  @keyframes hstep2{0%,40%,60%,100%{transform:rotate(0)}65%{transform:rotate(16deg)}}
  @keyframes wob2{0%,100%{transform:rotate(-12deg) translateX(-6px)}50%{transform:rotate(12deg) translateX(6px)}}
  @keyframes shake{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
  @keyframes drip{0%{transform:translateY(-4px);opacity:0}15%{opacity:1}100%{transform:translateY(34px);opacity:0}}
  @media (prefers-reduced-motion:reduce){.dd.hot{animation:none!important;background:#e5112b}}
  @media (prefers-reduced-motion:reduce){.stackbox,.blob,.sw,.zz,.look,.track,.lg{animation:none!important}}

  /* stats strip */
  .strip{display:grid;grid-template-columns:repeat(4,1fr);background:#1b1b1d;color:#fff;border-radius:34px;margin-top:26px;padding:20px 12px}
  .st{display:flex;align-items:center;gap:14px;padding:0 20px;border-left:2px solid #3a3a3d}
  .st:first-child{border-left:0}
  .st svg{flex:none;width:52px;height:52px}
  .st b{display:block;font:900 46px/.9 var(--f);letter-spacing:-2px}
  .st span{font:700 15px/1.1 var(--f);text-transform:uppercase;letter-spacing:-.2px}

  /* people filter + list */
  .people{display:flex;gap:8px;flex-wrap:wrap;margin:34px 0 14px}
  .chip{padding:9px 14px;font-size:13px}
  .chip.on{background:var(--ink);color:#fff}
  .chip small{opacity:.6;margin-left:4px}
  h2{font:900 26px var(--f);text-transform:uppercase;letter-spacing:-.6px;margin:26px 0 12px}
  .list{display:grid;gap:12px}
  .item{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:14px 16px;box-shadow:0 5px 0 var(--ink)}
  .item.done{opacity:.55}
  .rank{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:900 20px var(--f);border:3px solid var(--ink)}
  .item.critical .rank{background:var(--pink)} .item.high .rank{background:var(--yellow)} .item.medium .rank{background:var(--blue)}
  .title{margin:0;font:800 18px/1.2 var(--f);letter-spacing:-.3px}
  .note{margin:4px 0 8px;font:500 14px/1.3 var(--f);color:var(--muted)}
  .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .tag{font:700 12px/1 var(--f);padding:6px 10px;border-radius:99px;background:#f3eadf}
  .tag.critical{background:var(--pink)} .tag.high{background:var(--yellow)} .tag.medium{background:var(--blue);color:#fff}
  .tag.late{background:var(--red);color:#fff}
  .owners{display:flex;gap:6px;flex-wrap:wrap;margin-left:4px}
  .owner{display:inline-flex;align-items:center;gap:6px;font:700 13px var(--f)}
  .share{color:var(--muted);font-weight:600}
  .av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--c);font:800 12px var(--f);color:#161313;border:2px solid var(--ink)}
  .side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .side .row{display:flex;gap:6px}
  .empty{background:#fff;border:3px dashed var(--ink);border-radius:24px;padding:26px;text-align:center;font:800 18px var(--f)}
  body.presenting #helpBtn, body.presenting #backupBtn, body.presenting .side, body.presenting .addbtn, body.presenting .savestate, body.presenting #doneBtn{display:none}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(22,19,19,.5);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
  .modal{background:#fff;border:3px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:24px;width:min(520px,100%)}
  .modal h3{margin:0 0 6px;font:900 26px var(--f);text-transform:uppercase;letter-spacing:-.6px}
  .modal label{display:block;font:800 13px var(--f);margin:14px 0 6px}
  .modal input[type=text],.modal input[type=date],.modal textarea,.modal select{width:100%;font:600 15px var(--f);padding:10px 12px;border:3px solid var(--ink);border-radius:14px;background:#fffdf9;color:var(--ink)}
  .modal textarea{min-height:64px;resize:vertical}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg label{margin:0;display:inline-flex;align-items:center;gap:6px;font:700 13px var(--f);border:3px solid var(--ink);border-radius:99px;padding:7px 12px;cursor:pointer}
  .hint{margin:6px 0 0;font:500 12px/1.3 var(--f);color:var(--muted)}
  .loadrow{display:flex;align-items:center;gap:10px;margin-top:6px}
  .loadrow span{flex:1;font:700 14px var(--f)}
  .loadrow select{width:auto;flex:1}
  .mfoot{display:flex;justify-content:space-between;align-items:center;margin-top:20px}


  /* ---------- 16:9 TV canvas ---------- */
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg)}
  #tv{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;padding:30px 52px 26px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px}
  .top{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:end}
  h1{font-size:54px;line-height:.9;padding-right:0}
  .rt{display:flex;flex-direction:column;gap:12px}
  .actions{margin:0;justify-content:flex-end;gap:10px}
  .actions .sub{margin:0 auto 0 0!important;font-size:16px}
  .cap{padding:14px 26px 14px 38px;border-radius:44px}
  .cap .l{font-size:24px}
  .cap .pct{font-size:98px}
  .cap .msg{font-size:28px;max-width:420px;padding:18px 30px;border-radius:34px}
  .stage{overflow:visible;padding:8px 0 0;margin:0;justify-content:space-around;gap:0;align-items:flex-end;min-height:0}
  .col{flex:1 1 0;min-width:0}
  .blob{width:190px;height:211px}
  .nm{font-size:34px;margin-top:12px}
  .bar{width:72%;margin-top:8px}
  .bar .tr{height:20px} .bar b{font-size:19px;min-width:56px}
  .mood{font-size:14px;margin-top:6px}
  .shadow{width:170px}
  #app{min-height:0}
  .list{grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:10px}
  .item{grid-template-columns:42px minmax(0,1fr) auto;gap:12px;padding:9px 14px;border-radius:20px;box-shadow:0 4px 0 var(--ink);border-width:3px}
  .rank{width:38px;height:38px;font-size:17px;border-width:3px}
  .title{font-size:19px;line-height:1.12}
  .note{display:none}
  .meta{margin-top:5px;gap:5px}
  .tag{font-size:11px;padding:5px 8px}
  .owner{font-size:12px}
  .av{width:21px;height:21px;font-size:11px}
  .side{flex-direction:row;gap:5px}
  .mid{min-width:0}
  button.icon{padding:5px 9px;font-size:11px;border-width:2px}
  .empty{padding:18px;font-size:20px}
  #doneBtn.on{background:var(--ink);color:#fff}

  /* ---------- face animation ---------- */
  .eye,.eyei,.mouth,.brows,.zig,.oh,.pup{transform-box:fill-box;transform-origin:center}
  .eye{animation:blink 4.8s infinite;animation-delay:calc(var(--d,0s)*3)}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  /* bored: slow yawn */
  .col.bored .sm{animation:smHide 7s ease-in-out infinite;animation-delay:var(--d,0s)}
  .col.bored .yw{opacity:0;animation:yawn 7s ease-in-out infinite;animation-delay:var(--d,0s)}
  .col.bored .eyei{animation:squeeze 7s ease-in-out infinite;animation-delay:var(--d,0s)}
  @keyframes smHide{0%,34%,66%,100%{opacity:1}40%,60%{opacity:0}}
  @keyframes yawn{0%,34%,66%,100%{opacity:0;transform:scale(.2)}44%{opacity:1;transform:scale(1.15,1.25)}56%{opacity:1;transform:scale(1.05,1.15)}}
  @keyframes squeeze{0%,34%,66%,100%{transform:scaleY(1)}44%,56%{transform:scaleY(1.7) translateY(1px)}}
  /* light: effort breathing in time with the lift */
  .col.light .mouth{animation:grin 1.3s ease-in-out infinite;animation-delay:var(--d,0s)}
  .col.light .eyei{animation:effort 1.3s ease-in-out infinite;animation-delay:var(--d,0s)}
  .col.light .pup{animation:lookup 1.3s ease-in-out infinite;animation-delay:var(--d,0s)}
  @keyframes grin{0%,100%{transform:scale(.8,.55)}50%{transform:scale(1.15,1.3)}}
  @keyframes effort{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}
  @keyframes lookup{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  /* medium: tension, then an "oh!" at each catch */
  .col.medium .zig{animation:zigHide 8s linear infinite,quiver .9s ease-in-out infinite;animation-delay:calc(var(--d,0s)*5),0s}
  .col.medium .oh{opacity:0;animation:ohShow 8s ease-in-out infinite;animation-delay:calc(var(--d,0s)*5)}
  .col.medium .brows{animation:browUp 8s ease-in-out infinite;animation-delay:calc(var(--d,0s)*5)}
  .col.medium .eyei{animation:widen 8s ease-in-out infinite;animation-delay:calc(var(--d,0s)*5)}
  @keyframes zigHide{0%,26%,34%,76%,84%,100%{opacity:1}28%,32%,78%,82%{opacity:0}}
  @keyframes quiver{0%,100%{transform:translateX(-1px)}50%{transform:translateX(1px)}}
  @keyframes ohShow{0%,26%,34%,76%,84%,100%{opacity:0;transform:scale(.4)}29%,32%,79%,82%{opacity:1;transform:scale(1.15,1.25)}}
  @keyframes browUp{0%,36%,50%,86%,100%{transform:translateY(0)}20%,70%{transform:translateY(-5px)}28%,78%{transform:translateY(-11px)}}
  @keyframes widen{0%,36%,50%,86%,100%{transform:scale(1)}20%,70%{transform:scale(1.08)}28%,78%{transform:scale(1.22)}}
  /* heavy: panting, darting eyes */
  .col.heavy .mouth.pant{animation:pant 1.8s ease-in-out infinite}
  .col.heavy .mouth.wail{animation:wail 1.5s ease-in-out infinite}
  .col.heavy .eyei:not(.sq){animation:dart 1.4s ease-in-out infinite;animation-delay:var(--d,0s)}
  .col.heavy .eyei.sq{animation:squint 1.5s ease-in-out infinite}
  @keyframes pant{0%,100%{transform:scale(.8,.55)}50%{transform:scale(1,1.45)}}
  @keyframes wail{0%,100%{transform:scale(.85,.7)}50%{transform:scale(1.1,1.3)}}
  @keyframes dart{0%,100%{transform:translateX(0) scale(1.08)}25%{transform:translateX(-2px) scale(1.14)}75%{transform:translateX(2px) scale(1.14)}}
  @keyframes squint{0%,100%{transform:scale(1)}50%{transform:scale(1.18,.85)}}
  @media (prefers-reduced-motion:reduce){.eye,.eyei,.mouth,.brows,.zig,.oh,.pup{animation:none!important}}

  /* ---------- tabs, projects list, OOO ---------- */
  #tv{grid-template-rows:auto minmax(0,1fr)}
  .tab-board #app,.tab-board #doneBtn{display:none}
  .tab-projects #stage{display:none}
  .tabbtn.on{background:var(--ink);color:#fff}
  #app{overflow-y:auto;padding:6px 4px 10px;margin-top:10px}
  #app .list{grid-template-columns:1fr;gap:12px}

    function close(){root.innerHTML=''}
    document.getElementById('ocancel').onclick=close;
    document.getElementById('scrim').addEventListener('mousedown',function(e){if(e.target.id==='scrim')close()});
    if(state.ooo[nm]) document.getElementById('oclear').onclick=function(){delete state.ooo[nm]; close(); save()};
    document.getElementById('oform').onsubmit=function(e){
      e.preventDefault();
      var f=document.getElementById('o-from').value, b=document.getElementById('o-back').value;
      if(b&&f&&b<f){ document.getElementById('o-back').setCustomValidity('Back date must be after the start'); document.getElementById('o-back').reportValidity(); return }
      state.ooo[nm]={from:f,back:b}; close(); save();
    };
  }
  function find(id){return state.items.filter(function(x){return x.id===id})[0]}
  function move(id,dir){
    var it=find(id); var open=openItems();
    var p=open.indexOf(it), q=p+dir; if(q<0||q>=open.length) return;
    var other=open[q];
    var i=state.items.indexOf(it), j=state.items.indexOf(other);
    state.items[i]=other; state.items[j]=it;
    save();
  }

  function openModal(id){
    var it=id?find(id):{id:'',title:'',note:'',tier:'high',due:'',status:'todo',owners:[],size:'m',time:3,energy:3,load:{}};
    var root=document.getElementById('modalRoot');
    root.innerHTML='<div class="scrim" id="scrim"><form class="modal" id="form">'+
      '<h3>'+(id?'Edit item':'Add urgent item')+'</h3>'+
      (id&&it.status!=='done'?'<div class="seg" style="margin-bottom:4px"><button type="button" class="icon" id="upBtn">▲ Higher priority</button><button type="button" class="icon" id="downBtn">▼ Lower priority</button></div>':'')+
      '<label for="f-title">What is it?</label><input type="text" id="f-title" required value="'+esc(it.title)+'">'+
      '<label for="f-note">Short note (optional)</label><textarea id="f-note">'+esc(it.note)+'</textarea>'+
      '<label style="display:flex;gap:8px;align-items:center;background:#ffe9ec;border:2px solid #e0182d;border-radius:12px;padding:8px 12px"><input type="checkbox" id="f-super"'+(it.super?' checked':'')+'> <b>\u{1F9B8} Super urgent</b> <span style="font-weight:600;font-size:.85em">briefed directly by Hanan or Suzie</span></label>'+
      '<label>Priority level</label><div class="seg">'+Object.keys(TIERS).map(function(k){return '<label><input type="radio" name="tier" value="'+k+'"'+(it.tier===k?' checked':'')+'>'+TIERS[k]+'</label>'}).join('')+'</div>'+
      '<label>How much time will it take? <b id="tl" class="sl"></b></label><input type="range" class="slider" id="f-time" min="1" max="5" step="1" value="'+timeOf(it)+'"><div class="ends"><span>An hour</span><span>A week+</span></div>'+
      '<label>How much mental energy? <b id="el" class="sl"></b></label><input type="range" class="slider" id="f-energy" min="1" max="5" step="1" value="'+energyOf(it)+'"><div class="ends"><span>Autopilot</span><span>Draining</span></div>'+
      '<p class="hint">These two decide how big the box is and how heavy it feels for whoever carries it. Shared projects show up in each person&#39;s stack.</p>'+
      '<label>Who is working on it?</label><div class="seg">'+state.team.map(function(n){return '<label><input type="checkbox" name="own" value="'+esc(n)+'"'+(it.owners.indexOf(n)>-1?' checked':'')+'>'+esc(n)+'</label>'}).join('')+'</div>'+
      '<div id="loadsWrap"></div>'+
      '<label for="f-due">Due date</label><input type="date" id="f-due" value="'+esc(it.due)+'">'+
      '<label for="f-status">Status</label><select id="f-status">'+Object.keys(STATUS).map(function(k){return '<option value="'+k+'"'+(it.status===k?' selected':'')+'>'+STATUS[k]+'</option>'}).join('')+'</select>'+
      '<div class="mfoot"><div>'+(id?'<button type="button" class="danger" id="delBtn">Delete</button>':'')+'</div>'+
      '<div style="display:flex;gap:10px"><button type="button" id="cancelBtn">Cancel</button><button class="primary" type="submit">Save</button></div></div>'+
    '</form></div>';
    var f=document.getElementById('form');
    function sl(){document.getElementById('tl').textContent=TIME_L[f.querySelector('#f-time').value-1];document.getElementById('el').textContent=ENER_L[f.querySelector('#f-energy').value-1]}
    f.querySelector('#f-time').addEventListener('input',sl); f.querySelector('#f-energy').addEventListener('input',sl); sl();
    var curLoad=Object.assign({},it.load||{});
    function drawLoads(){
      [].slice.call(f.querySelectorAll('select[data-load]')).forEach(function(sel){curLoad[sel.getAttribute('data-load')]=sel.value});
      var ch=[].slice.call(f.querySelectorAll('input[name=own]:checked')).map(function(x){return x.value});
      var w=document.getElementById('loadsWrap');
      if(ch.length<2){w.innerHTML='';return}
      w.innerHTML='<label>Who pulls harder?</label>'+ch.map(function(n){
        var cur=SHARE[curLoad[n]]?curLoad[n]:'normal';
        return '<div class="loadrow"><span>'+esc(n)+'</span><select data-load="'+esc(n)+'">'+Object.keys(SHARE_LABEL).map(function(k){return '<option value="'+k+'"'+(cur===k?' selected':'')+'>'+SHARE_LABEL[k]+'</option>'}).join('')+'</select></div>';
      }).join('');
    }
    [].slice.call(f.querySelectorAll('input[name=own]')).forEach(function(cb){cb.addEventListener('change',drawLoads)});
    drawLoads();
    function close(){root.innerHTML=''}
    document.getElementById('cancelBtn').onclick=close;
    document.getElementById('scrim').addEventListener('mousedown',function(e){if(e.target.id==='scrim')close()});
    if(id&&document.getElementById('upBtn')){
      document.getElementById('upBtn').onclick=function(){close(); move(id,-1)};
      document.getElementById('downBtn').onclick=function(){close(); move(id,1)};
    }
    if(id) document.getElementById('delBtn').onclick=function(){
      state.items=state.items.filter(function(x){return x.id!==id}); close(); save();
    };
    f.onsubmit=function(e){
      e.preventDefault();
      var title=document.getElementById('f-title').value.trim(); if(!title) return;
      var data={
        title:title,
        note:document.getElementById('f-note').value.trim(),
        tier:f.querySelector('input[name=tier]:checked').value,
        super:!!f.querySelector('#f-super').checked,
        owners:[].slice.call(f.querySelectorAll('input[name=own]:checked')).map(function(x){return x.value}),
        due:document.getElementById('f-due').value,
        status:document.getElementById('f-status').value,
        time:+f.querySelector('#f-time').value, energy:+f.querySelector('#f-energy').value,
        size:sizeFromScore(.6*f.querySelector('#f-time').value+.4*f.querySelector('#f-energy').value),
        load:{}
      };
      if(data.owners.length>1){
        [].slice.call(f.querySelectorAll('select[data-load]')).forEach(function(sel){data.load[sel.getAttribute('data-load')]=sel.value});
      }
      if(id){ var wasSup=!!it.super; Object.assign(it,data);
        if(data.super&&!wasSup){ var ix=state.items.indexOf(it); if(ix>-1){ state.items.splice(ix,1); var z=0; while(z<state.items.length&&state.items[z].status==='done') z++; state.items.splice(z,0,it); } } }
      else {
        it.id='i'+Date.now().toString(36); Object.assign(it,data);
        // new item slots in below the last item of the same or higher level
        var order={critical:0,high:1,medium:2}, at=state.items.length, i;
        for(i=0;i<state.items.length;i++){ if(state.items[i].status!=='done' && order[state.items[i].tier]>order[it.tier]){at=i;break} }
        if(it.super){ at=0; while(at<state.items.length&&state.items[at].status==='done') at++; }
        state.items.splice(at,0,it);
      }
      close(); save();
    };
    document.getElementById('f-title').focus();
  }

  var pendingImport=null;
  function openBackup(msg){
    document.getElementById('modalRoot').innerHTML='<div class="pop" id="pop"><div class="card" style="max-width:460px"><h3>Backup</h3><div class="who">Keep a copy of every project, or restore one</div>'+(msg?'<div style="font-weight:700;margin-bottom:12px">'+msg+'</div>':'')+'<div class="btns"><button class="go" data-bk="export">Download backup file</button><button data-bk="import">Restore from a backup file…</button><button data-popclose="1">Close</button></div></div></div>';
  }
  function exportBackup(){
    var data=JSON.stringify({app:'creative-load',version:1,exported:new Date().toISOString(),state:state},null,2);
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download='creative-load-backup-'+iso(new Date())+'.json';
    document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove()},500);
    openBackup('Backup downloaded ✓');
  }
  function pickBackup(){
    var inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
    inp.onchange=function(){ var f=inp.files[0]; if(!f) return; var r=new FileReader();
      r.onload=function(){ try{ var d=JSON.parse(r.result), st=d&&d.state?d.state:d; if(!st||!Array.isArray(st.team)||!Array.isArray(st.items)) throw 0; pendingImport={st:st}; confirmImport(); }catch(e){ openBackup('That file does not look like a Creative Load backup.'); } };
      r.readAsText(f); };
    inp.click();
  }
  function confirmImport(){
    var st=pendingImport.st, n=st.items.length;
    document.getElementById('modalRoot').innerHTML='<div class="pop" id="pop"><div class="card" style="max-width:460px"><h3>Restore this backup?</h3><div class="who">'+n+' project'+(n===1?'':'s')+' for '+esc(st.team.join(', '))+'</div><div style="font-weight:600;margin-bottom:12px">This replaces everything currently on the board.</div><div class="btns"><button class="drop" data-bk="apply">Replace the board</button><button data-popclose="1">Cancel</button></div></div></div>';
  }
  function openNext(nm){
    var list=openItems().filter(function(x){return !inWeek(x)&&x.owners.indexOf(nm)>-1}).sort(function(a,b){return a.due<b.due?-1:(a.due>b.due?1:0)});
    var rows=list.map(function(it){return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px solid #eee"><span style="width:16px;height:16px;border-radius:5px;flex:none;background:'+it.color+'"></span><div style="flex:1;min-width:0"><div style="font-weight:800;font-size:16px">'+esc(trunc(it.title))+'</div><div style="font-size:13px;color:#7a6a5c;font-weight:600">Due '+esc(fmtD(it.due))+(it.owners.length>1?' \u00b7 with '+esc(it.owners.filter(function(o){return o!==nm}).join(', ')):'')+'</div></div><button class="icon" data-act="edit" data-id="'+it.id+'">Edit</button></div>'}).join('');
    document.getElementById('modalRoot').innerHTML='<div class="pop" id="pop"><div class="card" style="min-width:380px"><h3>Coming next for '+esc(nm)+'</h3><div class="who">Due after '+esc(fmtD(weekEnd()))+' \u00b7 not on the board yet</div>'+(rows||'<div style="padding:8px 0">Nothing queued.</div>')+'<div class="btns" style="margin-top:14px"><button data-popclose="1">Close</button></div></div></div>';
  }
  function popFor(id){
    var it=find(id); if(!it) return; var open=openItems(), pos=open.indexOf(it), isHold=it.status==='hold';
    var P=plan(), nof=it.owners.filter(function(o){return P[o]&&P[o].floor.indexOf(it)>-1});
    var h='<div class="pop" id="pop"><div class="card"><h3>'+esc(trunc(it.title))+'</h3><div class="who">'+esc(it.owners.join(' + ')||'Unassigned')+(isHold?' · on hold':(nof.length?' · on the floor (no room)':(' · priority '+(pos+1))))+'</div><div class="btns">';
    if(isHold) h+='<button class="go" data-act="resume" data-id="'+id+'">Pick it up</button>';
    else h+='<button data-act="up" data-id="'+id+'"'+(pos===0?' disabled':'')+'>▲ Move up (more important)</button><button data-act="down" data-id="'+id+'"'+(pos===open.length-1?' disabled':'')+'>▼ Move down (less important)</button><button class="drop" data-act="hold" data-id="'+id+'">Drop it on the floor</button><button class="go" data-act="done" data-id="'+id+'">Done ✓</button>';
    h+='<button data-act="edit" data-id="'+id+'">Edit</button><button data-popclose="1">Close</button></div></div></div>';
    document.getElementById('modalRoot').innerHTML=h;
  }
  document.addEventListener('click',function(e){
    if(e.target.id==='pop'){document.getElementById('modalRoot').innerHTML=''; return}
    var pk=e.target.closest('[data-pick]');
    if(pk&&!presenting&&!e.target.closest('button')){ popFor(pk.getAttribute('data-pick')); return }
    var b=e.target.closest('button'); if(!b) return;
    if(b.id==='backupBtn'){ openBackup(); return }
    if(b.hasAttribute('data-bk')){ var bk=b.getAttribute('data-bk');
      if(bk==='export') exportBackup(); else if(bk==='import') pickBackup();
      else if(bk==='apply'&&pendingImport){ state=pendingImport.st; state.ooo=state.ooo||{}; pendingImport=null; document.getElementById('modalRoot').innerHTML=''; save(); }
      return }
    if(b.hasAttribute('data-next')){ openNext(b.getAttribute('data-next')); return }
    if(b.id==='helpBtn'){
      document.getElementById('modalRoot').innerHTML='<div class="pop" id="pop"><div class="card" style="max-width:520px"><h3>How carrying works</h3><div class="who">Everyone has the same carrying limit</div>'+
        '<div style="font-size:16px;line-height:1.45;font-weight:600">'+
        '<p style="margin:0 0 10px"><b>The limit.</b> Each person can carry one full bar (100%). Once the bar is full, they can&#39;t pick up anything else.</p>'+
        '<p style="margin:0 0 10px"><b>This week only.</b> The board shows what is due by Friday, plus anything overdue or without a date. Projects due later wait on the Projects tab until their week comes up.</p><p style="margin:0 0 10px"><b>How big a box is.</b> It depends on how much time the project needs and how draining it is mentally, the two sliders when you add a project. Bigger boxes use more of the bar. As a rough guide, about three medium jobs fill a bar, or one big project plus a small job.</p>'+
        '<p style="margin:0 0 10px"><b>Shared projects.</b> The weight is split between the people on it, and "heavier / lighter share" changes who carries more.</p>'+
        '<p style="margin:0 0 10px"><b>What gets carried.</b> We go down the priority list, most important first. When the next box would not fit, it and everything below it goes on the floor. The top priority is always carried.</p>'+
        '<p style="margin:0"><b>Dropping by hand.</b> Click any box to move it up or down, or drop it on the floor yourself when someone can&#39;t take it on right now.</p></div>'+
        '<div class="btns" style="margin-top:14px"><button data-popclose="1">Got it</button></div></div></div>';
      return;
    }
    if(b.hasAttribute('data-popclose')){document.getElementById('modalRoot').innerHTML=''; return}
    if(b.id==='addBtn') return openModal();
    if(b.id==='presentBtn'){
      presenting=!presenting;
      try{ if(presenting&&document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); else if(!presenting&&document.fullscreenElement) document.exitFullscreen(); }catch(e){}
      return render();
    }
    if(b.id==='doneBtn'){showDone=!showDone; return render()}
    if(b.hasAttribute('data-tab')){tab=b.getAttribute('data-tab'); return render()}
    if(b.hasAttribute('data-ooo')) return openOoo(b.getAttribute('data-ooo'));
    var act=b.getAttribute('data-act'), id=b.getAttribute('data-id');
    var inPop=!!b.closest('#pop'); if(inPop&&act!=='edit') document.getElementById('modalRoot').innerHTML='';
    if(act==='up'){ move(id,-1); if(inPop) popFor(id) }
    else if(act==='down'){ move(id,1); if(inPop) popFor(id) }
    else if(act==='edit') openModal(id);
    else if(act==='done'){find(id).status='done'; save()}
    else if(act==='hold'){find(id).status='hold'; save()}
    else if(act==='resume'){find(id).status='todo'; save()}
    else if(act==='reopen'){find(id).status='todo'; save()}
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ document.getElementById('modalRoot').innerHTML=''; } });
  document.addEventListener('fullscreenchange',function(){ if(!document.fullscreenElement&&presenting){presenting=false; render();} });

  render();
  try{
    if(window.claude && window.claude.use){
      window.claude.use('artifact').then(function(a){ if(a){artifact=a; canSave=true; document.getElementById('savestate').textContent='';} else {render()} }).catch(function(){});
    }
  }catch(e){}
  function setMsg(t){ var e=document.getElementById('savestate'); if(e) e.textContent=t }
  function pushRemote(){
    setMsg('Saving…'); clearTimeout(pushT);
    pushT=setTimeout(function(){
      fetch(API,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({state:state})})
        .then(function(r){ if(!r.ok) throw 0; return r.json() })
        .then(function(d){ myRev=d.rev; dirty=false; setMsg('Saved · shared with the team') })
        .catch(function(){ setMsg('Saved on this device only (no connection)') });
    },500);
  }
  function pullRemote(first){
    return fetch(API,{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json() }).then(function(d){
      if(!d||!d.state){ if(first){ dirty=true; pushRemote(); } return }
      if(dirty||d.rev===myRev) return;
      var m=document.getElementById('modalRoot'); if(!first&&m&&m.firstChild) return;
      myRev=d.rev; state=d.state; state.ooo=state.ooo||{};
      try{ localStorage.setItem(STORE,JSON.stringify(state)) }catch(e){}
      render(); setMsg('Shared board · up to date');
    }).catch(function(){ setMsg('Offline · showing the last saved board') });
  }
  if(!(window.claude&&window.claude.use)){ canSave=true; render();
    pullRemote(true); setInterval(pullRemote,20000);
    var busy=function(){ var m=document.getElementById('modalRoot'); return !!(m&&m.firstChild) };
    /* keep the TV fresh: pick up edits made in another tab of this browser */
    window.addEventListener('storage',function(e){ if(e.key!==STORE||!e.newValue||busy()) return;
      try{ var p=JSON.parse(e.newValue); if(p&&p.team&&p.items){ state=p; render(); } }catch(x){} });
    /* re-draw every minute so dates, deadlines and out-of-office roll over by themselves */
    setInterval(function(){ if(!busy()) render(); },60000);
    document.addEventListener('visibilitychange',function(){ if(!document.hidden&&!busy()) render(); });
    /* reload by itself when a new version of the page has been deployed */
    var base=null;
    function checkNew(){
      fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){
        var sig=t.length+':'+t.slice(0,2000)+t.slice(-2000);
        if(base===null){ base=sig; return }
        if(sig!==base && !busy()) location.reload();
      }).catch(function(){});
    }
    checkNew(); setInterval(checkNew,300000);
  }
})();
</script>
</body>
